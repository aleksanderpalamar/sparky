name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TEST_THREADS: 2
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

defaults:
  run:
    shell: bash

jobs:
  standards:
    name: Convenções e empacotamento
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar rustfmt
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
      - name: Validar workflow com actionlint 1.7.12
        run: bash ci/actionlint.sh
      - name: Testar as regras do gate
        run: python3 -m unittest discover -s ci/tests -v
      - name: Validar alterações e checklist do PR
        run: python3 -m ci.check
      - name: Validar sintaxe dos scripts
        run: bash -n ci/actionlint.sh ci/cargo.sh packaging/build.sh packaging/arch/PKGBUILD
      - name: Testar regras dos pacotes DEB, RPM e Arch
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v

  rust:
    name: Rust (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - name: Checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config dbus-daemon libudev-dev libinput-dev \
            libxkbcommon-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libseat-dev libwayland-dev libglib2.0-dev libpolkit-agent-1-0
      - name: Instalar Rust e Clippy
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - name: Cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: sparky-${{ runner.os }}-${{ runner.arch }}-1.96.0-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
      - name: Compilar workspace
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          flags=()
          if [[ "$PROFILE" == release ]]; then
            flags+=(--release)
          fi
          bash ci/cargo.sh build --locked --workspace "${flags[@]}"
      - name: Executar testes unitários, integração e documentação
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          flags=()
          if [[ "$PROFILE" == release ]]; then
            flags+=(--release)
          fi
          bash ci/cargo.sh test --locked --workspace "${flags[@]}"
      - name: Clippy sem warnings
        if: matrix.profile == 'debug'
        run: bash ci/cargo.sh clippy --locked --workspace --all-targets -- -D warnings
      - name: Documentação sem warnings
        if: matrix.profile == 'debug'
        env:
          RUSTDOCFLAGS: -D warnings
        run: bash ci/cargo.sh doc --locked --workspace --no-deps

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [standards, rust]
    permissions: {}
    steps:
      - name: Exigir sucesso de todas as verificações
        env:
          STANDARDS_RESULT: ${{ needs.standards.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          [[ "$STANDARDS_RESULT" == success && "$RUST_RESULT" == success ]]
