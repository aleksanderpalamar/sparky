[package]
name = "sparky-files"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-files"
path = "src/main.rs"

[lib]
name = "sparky_files"
path = "src/lib.rs"

[dependencies]
fluent-bundle = "0.16"
sparky-i18n.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gio = "0.22"
quick-xml = "0.41"
serde_json = "1"
md-5 = "0.10"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rustix = { version = "1", features = ["fs"] }
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
tokio = { version = "1", features = ["rt"] }
sparky-storage.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
sparky-xdg.workspace = true
tempfile = "3"

[dev-dependencies]
iced_runtime = "0.14"
