[package]
name = "sparky-terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-terminal"
path = "src/main.rs"

[lib]
name = "sparky_terminal"
path = "src/lib.rs"

[dependencies]
alacritty_terminal = "0.26"
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
sparky-config.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
sparky-xdg.workspace = true
sparky-i18n.workspace = true
fluent-bundle = "0.16"

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
