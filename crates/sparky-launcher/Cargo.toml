[package]
name = "sparky-launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-launcher"
path = "src/main.rs"

[lib]
name = "sparky_launcher"
path = "src/lib.rs"

[dependencies]
fluent-bundle = "0.16"
sparky-i18n.workspace = true
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced_layershell = "0.19.1"
sparky-ipc.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
sparky-xdg.workspace = true
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
