[package]
name = "sparky-lock"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-lock"
path = "src/main.rs"

[lib]
name = "sparky_lock"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
iced_sessionlock = "0.19.1"
nix = { version = "0.31", features = ["user"] }
sparky-config.workspace = true
sparky-login-core.workspace = true
sparky-login-look.workspace = true
sparky-pam.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
tokio = { version = "1", features = ["rt"] }
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"
