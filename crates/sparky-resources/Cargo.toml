[package]
name = "sparky-resources"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-resources"
path = "src/main.rs"

[lib]
name = "sparky_resources"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal"] }
serde.workspace = true
sparky-config.workspace = true
sparky-hardware.workspace = true
sparky-ipc.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
