[package]
name = "polkit-sparky"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "polkit-sparky"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
glib = { version = "0.22", default-features = false }
iced = { version = "0.14", features = ["tokio"] }
iced_layershell = "0.19.1"
libc = "0.2"
libloading = "0.8"
serde.workspace = true
serde_json.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
