[package]
name = "sparky-monitor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-monitor"
path = "src/main.rs"

[lib]
name = "sparky_monitor"
path = "src/lib.rs"

[dependencies]
sparky-hardware.workspace = true
sparky-i18n.workspace = true
sparky-resources.workspace = true
fluent-bundle = "0.16"
iced = { version = "0.14", features = ["canvas", "image", "svg", "tokio"] }
serde.workspace = true
serde_json.workspace = true
rustix = { version = "1", features = ["fs", "param", "process"] }
tokio = { version = "1", features = ["rt"] }
sparky-theme.workspace = true
sparky-ui.workspace = true
sparky-xdg.workspace = true

[dev-dependencies]
iced = { version = "0.14", features = ["advanced"] }
iced_runtime = "0.14"
tempfile = "3"
