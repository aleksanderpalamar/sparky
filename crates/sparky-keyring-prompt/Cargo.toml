[package]
name = "sparky-keyring-prompt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-keyring-prompt"
path = "src/main.rs"

[lib]
name = "sparky_keyring_prompt"
path = "src/lib.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_layershell = "0.19.1"
sparky-theme.workspace = true
sparky-ui.workspace = true
zeroize = { version = "1", features = ["std"] }
