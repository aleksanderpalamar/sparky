[package]
name = "sparky-bar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-bar"
path = "src/main.rs"

[lib]
name = "sparky_bar"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iced = { version = "0.14", features = ["advanced", "image", "svg", "tokio"] }
iced_layershell = "0.19.1"
libpulse-binding = "2.30.1"
sparky-ipc.workspace = true
sparky-notifications.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
sparky-xdg.workspace = true
system-tray = "0.8"
tokio = { version = "1", features = ["sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1.9"

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
