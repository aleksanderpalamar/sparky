[package]
name = "sparky-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-store"
path = "src/main.rs"

[lib]
name = "sparky_store"
path = "src/lib.rs"

[dependencies]
fluent-bundle = "0.16"
iced = { version = "0.14", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
sparky-i18n.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
tokio = { version = "1", features = ["rt"] }
