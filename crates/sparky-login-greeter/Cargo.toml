[package]
name = "sparky-login-greeter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sparky-login-greeter"
path = "src/main.rs"

[lib]
name = "sparky_login_greeter"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
iced_layershell = "0.19.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sparky-login-core.workspace = true
sparky-theme.workspace = true
sparky-ui.workspace = true
sparky-xdg.workspace = true
tokio = { version = "1", features = ["rt"] }
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
iced_test = "0.14"
