[package]
name = "sparky-compositor"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "sparky"
path = "src/main.rs"

[lib]
name = "sparky_compositor"
path = "src/lib.rs"

[dependencies]
sparky-ipc.workspace = true
sparky-theme.workspace = true
sparky-tiling.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "x11rb_event_source",
    "xwayland",
]
