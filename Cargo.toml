[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aleksander Palamar <apalamardev@gmail.com>"]

[workspace.dependencies]
iced_core = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sparky-config = { path = "crates/sparky-config" }
sparky-ipc = { path = "crates/sparky-ipc" }
sparky-theme = { path = "crates/sparky-theme" }
sparky-tiling = { path = "crates/sparky-tiling" }
